# Every push to main and every pull request: lint the workflows and scripts, and check that both versions'
# source + patch series still produce their pinned trees. Builds run from build.yml (tags and dispatch).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color -shellcheck=
      - name: shellcheck (errors)
        run: shellcheck -S error scripts/*.sh scripts/fpc-toolchain
      - name: PowerShell parses
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $e = $null; [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e) { $e | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
          }

  source:
    strategy:
      fail-fast: false
      matrix:
        version: ['3.2.4', '3.3.1']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Source + series give the pinned tree
        run: scripts/fetch-source.sh ${{ matrix.version }} "$RUNNER_TEMP/src"

  # The installers retry a network failure and stop at once on a release that does not exist. No archive is
  # downloaded: a proxy on a closed port stands in for an unreachable network, and github.com answers 404
  # for release 0.0.0-b1.
  download-retry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        run: |
          if https_proxy=http://127.0.0.1:9 sh scripts/install.sh --root "$RUNNER_TEMP/r" 3.3.1+3 2> err.txt; then exit 1; fi
          cat err.txt; [ "$(grep -c 'retrying in' err.txt)" = 3 ]
          if sh scripts/install.sh --root "$RUNNER_TEMP/r" 0.0.0+1 2> err.txt; then exit 1; fi
          cat err.txt
          if grep -q 'retrying in' err.txt; then exit 1; fi
          grep -q 'HTTP 404): is 0.0.0-b1 a release of frostney/fpc-toolchain?' err.txt
      - name: install.ps1
        shell: pwsh
        run: |
          # Each install runs in its own pwsh (.NET reads HTTPS_PROXY once per process), which prints the
          # installer's warnings and error message as plain text so pwsh's error view cannot wrap them.
          $env:FPC_TOOLCHAIN_ROOT = "$env:RUNNER_TEMP/r"
          function Install([string]$identity) {
            $env:IDENTITY = $identity
            $out = & pwsh -NoProfile -Command {
              try { ./scripts/install.ps1 -HostId x86_64-win64 -Identity $env:IDENTITY 3>&1 | ForEach-Object { "$_" } }
              catch { Write-Output FAILED:; Write-Output $_.Exception.Message; exit 1 }
            } 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 1 -or $out -notmatch 'FAILED:') { throw "installing $identity did not fail" }
            return $out -replace '\s+', ' '
          }
          $env:HTTPS_PROXY = 'http://127.0.0.1:9'
          $out = Install '3.3.1+3'
          if ([regex]::Matches($out, 'retrying in').Count -ne 3) { throw 'expected 3 retries' }
          Remove-Item Env:HTTPS_PROXY
          $out = Install '0.0.0+1'
          if ($out -match 'retrying in' -or $out -notmatch 'HTTP 404\): is 0\.0\.0-b1 a release of frostney/fpc-toolchain\?') {
            throw 'expected an immediate HTTP 404 naming the release and repository'
          }
          # the expected failures leave $LASTEXITCODE at 1, which the runner would otherwise exit with
          exit 0
