# Test the action (uses: ./) on every host: install, compile and run hello world natively, cross-compile,
# then a second job that must come back from the cache. Called by build.yml before a release is published;
# can also be run by hand against any release.
name: action-test

on:
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      artifacts:
        description: 'install from this run''s dist-* artifacts instead of the release'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release:
        description: 'release tag to test, e.g. 3.3.1-b1 (default: newest release)'
        required: false

permissions:
  contents: write   # draft releases are only visible to tokens with push access

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: scripts/action-test-plan.sh
      - if: steps.plan.outputs.ship == 'true' && inputs.artifacts
        uses: actions/download-artifact@v4
        with: { pattern: 'dist-*', merge-multiple: true, path: '${{ runner.temp }}/dist' }
      - id: fpc
        if: steps.plan.outputs.ship == 'true'
        uses: ./
        with:
          release: ${{ inputs.release }}
          targets: ${{ steps.plan.outputs.cross }}
          archives: ${{ inputs.artifacts && format('{0}/dist', runner.temp) || '' }}
      - if: steps.plan.outputs.ship == 'true'
        run: scripts/action-test-check.sh '${{ steps.fpc.outputs.version }}' '${{ steps.fpc.outputs.identity }}' '${{ steps.plan.outputs.cross }}'
      - name: 'Same job again: runner tool cache'
        id: again
        if: steps.plan.outputs.ship == 'true'
        uses: ./
        with:
          release: ${{ inputs.release }}
          targets: ${{ steps.plan.outputs.cross }}
          archives: ${{ inputs.artifacts && format('{0}/dist', runner.temp) || '' }}
      - if: steps.plan.outputs.ship == 'true'
        run: test '${{ steps.again.outputs.cache-hit }}' = true

  cached:
    needs: install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: scripts/action-test-plan.sh
      - id: fpc
        if: steps.plan.outputs.ship == 'true'
        uses: ./
        with:
          release: ${{ inputs.release }}
          targets: ${{ steps.plan.outputs.cross }}
          archives: ${{ inputs.artifacts && format('{0}/dist', runner.temp) || '' }}
      - name: Restored from actions/cache, identity checked
        if: steps.plan.outputs.ship == 'true'
        run: |
          test '${{ steps.fpc.outputs.cache-hit }}' = true
          scripts/action-test-check.sh '${{ steps.fpc.outputs.version }}' '${{ steps.fpc.outputs.identity }}' '${{ steps.plan.outputs.cross }}'
