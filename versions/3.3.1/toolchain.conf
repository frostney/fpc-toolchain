# FPC 3.3.1 (trunk): what versions/3.3.1 builds. Sourced by scripts/*.sh (POSIX sh syntax, no spaces around =).
TOOLCHAIN_REPO=frostney/fpc-toolchain
FPC_VERSION=3.3.1
# Upstream FPC source: trunk (main) at fa51767875 (2026-10-14, "Fix treatment of empty JSON").
FPC_SOURCE_URL=https://gitlab.com/freepascal.org/fpc/source.git
FPC_SOURCE_COMMIT=fa51767875e16b9ab7ae8f37c8817bcb90452fae
# Carried patch series, applied in name order with `git am` on top of FPC_SOURCE_COMMIT.
# Override with FPC_PATCH_DIR=<dir>, or FPC_PATCH_GIT=<url>#<ref> to take the series from a branch
# whose history is FPC_SOURCE_COMMIT + the series (e.g. the local patched-trunk branch).
FPC_PATCH_DIR=patches
# Tree that FPC_SOURCE_COMMIT + patches/ must produce (git tree hash; empty = do not check).
# = tree of fa51767875 + 0001-0117: patched-trunk 0caef8ad (0001-0077), 0078 (i8086 cpuinfo), 0079 (TLS model
# of libraries), 0080-0113 and 0116-0117 (x86_64 code generation and the wrong-code fixes it needed), 0114-0115
# (anonymous functions in the main block and in unit sections).
FPC_EXPECT_TREE=bcaa828bd2db9b983e7090624b066b664a3aa4d6
# Upstream minorpatch of version.pas at FPC_SOURCE_COMMIT ('' on trunk). The build identity is
# FPC_VERSION + FPC_UPSTREAM_MINORPATCH + '+' + BUILD (e.g. 3.3.1+1); it replaces minorpatch so that
# `fpc -iW` prints it.
FPC_UPSTREAM_MINORPATCH=
# Bootstrap compiler release used when none is given (official FPC binaries; sha256 pinned in scripts/bootstrap.sh).
BOOTSTRAP_VERSION=3.2.2
# Hosts the release ships toolchains for. Windows hosts are built on the Linux x86_64 runner
# (canadian cross: compilers that run on Windows, built with the Linux-hosted cross compilers).
TOOLCHAIN_HOSTS="x86_64-linux aarch64-linux aarch64-darwin x86_64-darwin x86_64-win64 aarch64-win64"
# Targets whose hello world must RUN in the smoke test (emulator installed by the workflow), comma list.
# wasm32-wasip1 is a release gate for 3.3.1 (wasmtime).
SMOKE_REQUIRE_RUN=wasm32-wasip1
# Defines the compilers are built with, space separated, each passed to make as OPT=-d<name> (the RTL and
# packages builds get them too and ignore them). tls_threadvars: compilers for Linux x86_64, i386 and arm and for
# FreeBSD i386 keep threadvars in ELF TLS sections (%fs/%gs; local-exec in programs, global-dynamic in libraries)
# instead of finding each one through pthread_getspecific (compiler/systems/i_linux.pas, i_bsd.pas).
FPC_COMPILER_DEFINES=tls_threadvars
# FPC_SOFT_FPUX80 compiles here: hosts without 80-bit Extended build x86 compilers with it, and Windows x64 hosts
# get a ppcx64.exe that reads the 80-bit units of the other x86_64 targets.
SOFT_FPUX80=1
# Author written into the carried patches by scripts/update-series.sh: patches whose author has this name
# get this address, whatever address the source branch used.
SERIES_AUTHOR="Johannes Stein <johannesstein@freeze-dev.com>"
