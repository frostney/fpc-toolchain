# fpc-toolchain-3.2.4: what this repository builds. Sourced by scripts/*.sh (POSIX sh syntax, no spaces around =).
TOOLCHAIN_REPO=frostney/fpc-toolchain-3.2.4
FPC_VERSION=3.2.4
# Upstream FPC source: branch release_3_2_4-branch head 82947b0d (2026-09-06) = tag release_3_2_4_rc2
# (2a105860, 2026-08-26) + 8 commits (FreeBSD .note.GNU-stack, OS/2, help leak, #40071, #41858, package
# example dedup). Switch to the release_3_2_4 tag when 3.2.4 final ships (and set FPC_UPSTREAM_MINORPATCH=).
FPC_SOURCE_URL=https://gitlab.com/freepascal.org/fpc/source.git
FPC_SOURCE_COMMIT=82947b0dc135313b2bd64c208025de4bc81b2c2f
# Carried patches (git am, name order). See patches/README.md for why each is carried.
FPC_PATCH_DIR=patches
FPC_EXPECT_TREE=
FPC_UPSTREAM_MINORPATCH=-rc2
BOOTSTRAP_VERSION=3.2.2
# Hosts the release ships toolchains for (3.2.x has no aarch64-win64 target, so no Windows ARM64 host).
# Windows hosts are built on the Linux x86_64 runner (canadian cross).
TOOLCHAIN_HOSTS="x86_64-linux aarch64-linux aarch64-darwin x86_64-darwin x86_64-win64"
# Targets whose hello world must RUN in the smoke test (emulator installed by the workflow), comma list.
SMOKE_REQUIRE_RUN=
